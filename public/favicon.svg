<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#000000"/>
  <!-- Orbital ring -->
  <circle cx="16" cy="16" r="10" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" fill="none"/>
  <!-- Core dot -->
  <circle cx="16" cy="16" r="3" fill="white"/>
  <!-- Orbiting dot -->
  <circle cx="16" cy="5.5" r="2" fill="#818cf8"/>
</svg>
